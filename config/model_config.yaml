Base:
    model_root: './checkpoints/'
    num_workers: 4
    verbose: 1
    early_stop_patience: 2
    pickle_feature_encoder: True
    save_best_only: True
    eval_steps: null
    debug_mode: False
    group_id: user_id
    use_features: null
    feature_specs: null
    feature_config: null
    dense_optimizer: AdamW
    sparse_optimizer: Adagrad
    dense_learning_rate: 1.0e-4
    sparse_learning_rate: 0.05
    dense_weight_decay: 0
    enable_torch_compile: True
    gradient_checkpointing: False

RankMixer_QK_Video_Action: # This is a config template
    model: RankMixer
    dataset_id: QK_Video_Action
    loss: ['binary_crossentropy', 'binary_crossentropy', 'binary_crossentropy', 'binary_crossentropy']
    num_tasks: 4
    metrics: ['logloss', 'AUC']
    task: binary_classification
    batch_size: 8192
    embedding_dim: 16
    num_layers: 3
    expansion_factor: 2
    token_dim: 256
    num_ns_token: 4
    tokenizer_type: Chunk
    tower_hidden_units: [128, 64]
    tower_activations: ReLU
    attention_dropout: 0
    net_dropout: 0
    epochs: 1
    shuffle: True
    seed: 20262027
    monitor: {'AUC': 1, 'logloss': 0}
    monitor_mode: 'max'
    max_len: 100
    accumulation_steps: 1

RankMixer_KuaiRand_Video_Action: &rankmixer_kuairand_scaling_base
    model: RankMixer
    dataset_id: KuaiRand_Video_Action
    loss: ['binary_crossentropy', 'binary_crossentropy', 'binary_crossentropy', 'binary_crossentropy', 'binary_crossentropy', 'binary_crossentropy']
    num_tasks: 6
    metrics: ['logloss', 'AUC']
    task: binary_classification
    batch_size: 8192
    embedding_dim: 16
    num_layers: 3
    expansion_factor: 2
    token_dim: 256
    num_ns_token: 4
    tokenizer_type: Chunk
    tower_hidden_units: [128, 64]
    tower_activations: ReLU
    attention_dropout: 0
    net_dropout: 0
    epochs: 1
    shuffle: True
    seed: 20262027
    monitor: {'AUC': 1, 'logloss': 0}
    monitor_mode: 'max'
    max_len: 100
    accumulation_steps: 1

# Scale only token_dim; num_layers=2, num_ns_token=4, and max_len=100 remain fixed.
RankMixer_KuaiRand_Video_Action_Ablation_TokenDim_Tiny:
    <<: *rankmixer_kuairand_scaling_base
    num_layers: 2
    token_dim: 32

RankMixer_KuaiRand_Video_Action_Ablation_TokenDim_Small:
    <<: *rankmixer_kuairand_scaling_base
    num_layers: 2
    token_dim: 64

RankMixer_KuaiRand_Video_Action_Ablation_TokenDim_Mid:
    <<: *rankmixer_kuairand_scaling_base
    num_layers: 2
    token_dim: 128

RankMixer_KuaiRand_Video_Action_Ablation_TokenDim_Large:
    <<: *rankmixer_kuairand_scaling_base
    num_layers: 2
    token_dim: 256

RankMixer_KuaiRand_Video_Action_Ablation_TokenDim_Ultra:
    <<: *rankmixer_kuairand_scaling_base
    num_layers: 2
    token_dim: 512

# Scale only max_len; num_layers=2, token_dim=256, and num_ns_token=4 remain fixed.
RankMixer_KuaiRand_Video_Action_Ablation_MaxLen_Tiny:
    <<: *rankmixer_kuairand_scaling_base
    num_layers: 2
    max_len: 32

RankMixer_KuaiRand_Video_Action_Ablation_MaxLen_Small:
    <<: *rankmixer_kuairand_scaling_base
    num_layers: 2
    max_len: 64

RankMixer_KuaiRand_Video_Action_Ablation_MaxLen_Mid:
    <<: *rankmixer_kuairand_scaling_base
    num_layers: 2
    max_len: 128

RankMixer_KuaiRand_Video_Action_Ablation_MaxLen_Large:
    <<: *rankmixer_kuairand_scaling_base
    num_layers: 2
    max_len: 256

# Scale only num_layers; reuse the existing 2-layer and 3-layer results.
RankMixer_KuaiRand_Video_Action_Ablation_NumLayers_Mid:
    <<: *rankmixer_kuairand_scaling_base
    num_layers: 4

RankMixer_KuaiRand_Video_Action_Ablation_NumLayers_Large:
    <<: *rankmixer_kuairand_scaling_base
    num_layers: 6

# Baseline-noise probe: five runs of RankMixer_KuaiRand_Video_Action that differ in
# nothing but `seed`. They exist to measure the run-to-run standard deviation of the
# test metrics (see run_probe.sh), which is the reference an automated evaluation loop
# needs before it can call any single-run difference an improvement.
#
# Deliberately plain `<<:` + `seed:` blocks rather than a generated config: the point of
# the measurement is that a probe run is indistinguishable from an ordinary baseline run,
# so it has to come from this file, through the same loader, with the same defaults.
RankMixer_KuaiRand_Video_Action_NoiseProbe_s11:
    <<: *rankmixer_kuairand_scaling_base
    seed: 11

RankMixer_KuaiRand_Video_Action_NoiseProbe_s12:
    <<: *rankmixer_kuairand_scaling_base
    seed: 12

RankMixer_KuaiRand_Video_Action_NoiseProbe_s13:
    <<: *rankmixer_kuairand_scaling_base
    seed: 13

RankMixer_KuaiRand_Video_Action_NoiseProbe_s14:
    <<: *rankmixer_kuairand_scaling_base
    seed: 14

RankMixer_KuaiRand_Video_Action_NoiseProbe_s15:
    <<: *rankmixer_kuairand_scaling_base
    seed: 15

RankMixer_KuaiRand_Video_Action_Tokenizer_Auto:
    <<: *rankmixer_kuairand_scaling_base
    tokenizer_type: Auto

RankMixer_KuaiRand_Video_Action_Tokenizer_Field:
    <<: *rankmixer_kuairand_scaling_base
    token_dim: 128
    tokenizer_type: Field

RankMixer_KuaiRand_Video_Action_Tokenizer_Random:
    <<: *rankmixer_kuairand_scaling_base
    tokenizer_type: Random

RankMixer_KuaiRand_Video_Action_Optimizer_Muon:
    <<: *rankmixer_kuairand_scaling_base
    dense_optimizer: heavyball.Muon
    dense_learning_rate: 1.0e-2

RankMixer_KuaiRand_Video_Action_Optimizer_LaProp:
    <<: *rankmixer_kuairand_scaling_base
    dense_optimizer: heavyball.LaProp
    dense_learning_rate: 4.0e-4

RankMixer_KuaiRand_Video_Action_Optimizer_Scion:
    <<: *rankmixer_kuairand_scaling_base
    dense_optimizer: heavyball.Scion
    dense_learning_rate: 2.5e-3

RankMixer_KuaiRand_Video_Action_Optimizer_SOAP:
    <<: *rankmixer_kuairand_scaling_base
    dense_optimizer: heavyball.SOAP
    dense_learning_rate: 1.0e-3

RankMixer_KuaiRand_Video_Action_Optimizer_RMSProp:
    <<: *rankmixer_kuairand_scaling_base
    dense_optimizer: heavyball.RMSprop
    dense_learning_rate: 1.0e-4

